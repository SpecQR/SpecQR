name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run examples:smoke
      - run: npm run pages:build
      - run: npm run verify:decode:jsqr
      - run: npm run verify:reference:nayuki
      - run: npm run verify:pack
      - run: npm pack --dry-run
