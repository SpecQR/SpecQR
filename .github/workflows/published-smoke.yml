name: 公開済み package smoke

on:
  workflow_dispatch:
    inputs:
      package_specs:
        description: "検証する exact version と dist-tag の package spec（半角スペース区切り）"
        required: false
        default: "specqr@3.0.0-rc.1 specqr@next"
      expected_version:
        description: "すべての package spec が解決すべき version"
        required: true
        default: "3.0.0-rc.1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: >-
          node tools/verify-published-package.js
          --expected-version "${{ inputs.expected_version }}"
        env:
          SPECQR_PUBLISHED_SPECS: ${{ inputs.package_specs }}
