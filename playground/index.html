<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpecQR Playground</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app">
      <section class="workspace" aria-label="QR generator">
        <div class="controls">
          <header>
            <p class="eyebrow">SpecQR Playground</p>
            <h1>QR 生成確認</h1>
          </header>

          <label>
            入力
            <textarea id="qr-input" rows="6">https://github.com/SpecQR/SpecQR</textarea>
          </label>

          <div class="control-grid">
            <label>
              生成
              <select id="qr-workflow">
                <option value="single" selected>Single QR</option>
                <option value="structured">Structured Append</option>
              </select>
            </label>
            <label>
              入力形式
              <select id="qr-kind">
                <option value="text">Text / URL</option>
                <option value="gs1">GS1 human-readable</option>
                <option value="digital-link">GS1 Digital Link URI</option>
              </select>
            </label>
            <label id="qr-digital-link-policy-control">
              Unknown query
              <select id="qr-digital-link-policy">
                <option value="preserve" selected>preserve</option>
                <option value="reject">reject</option>
              </select>
            </label>
            <label>
              ECC
              <select id="qr-ecc">
                <option value="L">L</option>
                <option value="M" selected>M</option>
                <option value="Q">Q</option>
                <option value="H">H</option>
              </select>
            </label>
            <label>
              Version
              <select id="qr-version">
                <option value="auto" selected>auto</option>
              </select>
            </label>
            <label id="qr-max-symbols-control">
              Max symbols
              <input id="qr-max-symbols" type="number" min="2" max="16" value="16">
            </label>
            <label id="qr-split-detail-control">
              Manual split detail
              <select id="qr-split-detail">
                <option value="summary" selected>summary</option>
                <option value="full">full</option>
              </select>
            </label>
            <label>
              Scale
              <input id="qr-scale" type="number" min="1" max="24" value="8">
            </label>
            <label>
              Margin
              <input id="qr-margin" type="number" min="0" max="12" value="4">
            </label>
          </div>

          <div class="actions">
            <a id="download-svg" class="button" download="specqr.svg" aria-disabled="true" data-testid="download-svg">SVG</a>
            <a id="download-png" class="button" download="specqr.png" aria-disabled="true" data-testid="download-png">PNG</a>
          </div>
        </div>

        <div class="preview-area">
          <div id="qr-preview" class="preview" aria-label="QR preview" aria-live="polite" data-testid="qr-preview"></div>
          <div id="qr-error" class="error" role="alert" hidden data-testid="qr-error"></div>
        </div>

        <aside class="diagnostics">
          <details id="qr-print-check" class="print-check">
            <summary>印刷サイズを確認</summary>
            <p id="qr-print-help">用紙幅ではなく、実際に印刷できる幅を入力してください。</p>
            <div class="control-grid">
              <label>
                印刷可能幅 (mm)
                <input id="qr-print-width" type="text" inputmode="decimal" maxlength="24"
                       aria-describedby="qr-print-help">
              </label>
              <label>
                解像度
                <input id="qr-print-density" type="text" inputmode="decimal" maxlength="24" value="300">
              </label>
              <label>
                解像度の単位
                <select id="qr-print-density-unit">
                  <option value="dpi">dpi</option>
                  <option value="dots/mm">dots/mm</option>
                </select>
              </label>
              <label>
                ドット数 / モジュール
                <input id="qr-print-module-dots" type="number" min="1" step="1" value="4">
              </label>
            </div>
            <p id="qr-print-result" role="status" aria-atomic="true"></p>
            <p>縦横が同じ実解像度で、プリンターのドットに 1:1 で印刷する前提です。
              読み取りや GS1 適合は保証しません。SVG / PNG の出力設定は変わりません。</p>
          </details>

          <h2>Planning</h2>
          <dl id="qr-planning" aria-label="Planning results" data-testid="qr-planning"></dl>
          <h2>Diagnostics</h2>
          <dl id="qr-diagnostics" aria-label="Generation diagnostics" data-testid="qr-diagnostics"></dl>
          <h3>Warnings</h3>
          <ul id="qr-warnings" aria-label="Warnings" data-testid="qr-warnings"></ul>
        </aside>
      </section>
    </main>

    <script type="module" src="./playground.js"></script>
  </body>
</html>
